<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Thank you — AI Automation Cyprus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Inter:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream: #f2ede6;
      --dark:  #1a1814;
      --muted: #5a5750;
      --light: #edeae4;
    }

    body {
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      font-size: 1rem;
      line-height: 1.75;
      color: var(--dark);
      background: var(--cream);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      padding: 80px 24px;
    }

    .inner { max-width: 700px; margin: 0 auto; }

    h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 400;
      font-size: clamp(2rem, 5vw, 3.2rem);
      line-height: 1.2;
      letter-spacing: -0.01em;
      margin-bottom: 24px;
    }

    p {
      color: var(--muted);
      margin-bottom: 16px;
    }

    a {
      color: var(--dark);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    footer {
      padding: 40px 24px;
      background: var(--light);
      color: var(--muted);
      font-size: 0.85rem;
    }

    footer .inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    @media (max-width: 480px) {
      footer .inner { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>

<main>
  <div class="inner">
    <h1>Thank you, we'll be in touch.</h1>
    <p>We've received your message and will get back to you within one business day.</p>
    <p><a href="/">Back to home →</a></p>
  </div>
</main>

<footer>
  <div class="inner">
    <span>AI Automation Cyprus</span>
    <span>© 2026 All rights reserved</span>
  </div>
</footer>

</body>
</html>
